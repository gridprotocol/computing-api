---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:       
      app.kubernetes.io/name: mefs-user
      app/clean: label-for-clean
  name: user    
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mefs-user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mefs-user
    spec:
      nodeSelector:
        kubernetes.io/hostname: m20

      initContainers:
      - name: init-user
        image: webserver_user_test_auto:latest  # Use your Docker image
        imagePullPolicy: IfNotPresent
        command: [ "sh", "-c" ]
        args:
        - |
        # 容器启动时创建目录
        mkdir -p /root/memo_user && 
        mkdir -p /root/memo_user/data && 
        echo "/root/memo_user and /root/memo_user/data directory created!" && 
        /app/init_user.sh > /root/memo_user/log ;  # 执行脚本
        volumeMounts:
        - name: host-memo-volumn
          mountPath: /root
        # - name: memo-user-volume
        #   mountPath: /root/memo  # 容器内部的挂载路径
        # - name: user-data-volume
        #   mountPath: /root/memo/data  # 容器内部的挂载路径   
     
      terminationGracePeriodSeconds: 60
      containers:
      - name: mefs-user
        image: webserver_user_test_auto:latest  # Use your Docker image
        imagePullPolicy: IfNotPresent        
        ports:
           - containerPort: 8080  # Replace with the first port you want to expose
           - containerPort: 4002

        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "rm -rf /root/*"]

        env:
           - name: PASSWORD
             value: "memoriae"     
           - name: PRICE
             value: "250000"
           - name: GROUP
             value: "1"    
           - name: SWARM_PORT
             value: "4002"
           - name: DATA_PATH
             value: "/root/memo_user/data"
           - name: MEFS_PATH
             value: "/root/memo_user/.memo-user"
           - name: GATEWAY
             value: "true"
           - name: GATEWAY_USERNAME
             value: "admin"
           - name: GATEWAY_PASSWORD
             value: "memoriae"
           - name: BIND_ADDRESS
             value: "0.0.0.0"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: host-memo-volumn
          mountPath: /root
        # - name: memo-user-volume
        #   mountPath: /root/memo  # 容器内部的挂载路���
        # - name: user-data-volume
        #   mountPath: /root/memo/data  # 容器内部的挂载路径       
      volumes:
        - name:  host-memo-volumn
          hostPath:
            path: /root/memo # host memo
            type: DirectoryOrCreate
        # - name:  memo-user-volume
        #   hostPath:
        #     path: /root/memo/memo_user  # Host path to models
        #     type: DirectoryOrCreate
        # - name: user-data-volume
        #   hostPath:
        #     path: /root/memo/memo_user_data  # Host path for outputs
        #     type: DirectoryOrCreate


---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app.kubernetes.io/name: mefs-user
  ports:
    - name: mefs-user
      protocol: TCP
      port: 4002
      targetPort: 4002
      nodePort: 32042
    - name: gateway
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 32080 
  type: NodePort