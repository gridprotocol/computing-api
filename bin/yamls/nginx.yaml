apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: nginx-example
    app/clean: label-for-clean
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-example
    spec:
      containers:
      - image: docker.io/library/nginx:latest
        name: nginx
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # resources:
        #   requests:
        #     memory: "16Mi"
        #     cpu: "250m"
        #   limits:
        #     memory: "32Mi"
        #     cpu: "500m"

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
     app.kubernetes.io/name: nginx-example
  ports:
   - name: webserver
     protocol: TCP
     port: 80
     targetPort: 80
     nodePort: 32180
  type: NodePort